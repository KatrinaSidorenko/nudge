name: Bug report
description: Something behaves incorrectly.
title: "fix: "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: Remember to add exactly one `area:*` label after creating this issue.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: false
